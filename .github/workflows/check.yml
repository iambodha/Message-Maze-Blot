name: Maze checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  maze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run export -- "HELLO WORLD" hello-world.svg
      - uses: actions/upload-artifact@v4
        with:
          name: hello-world-maze
          path: hello-world.svg
